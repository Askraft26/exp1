<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no" />
  <title>AR Interactive Escanor</title>
  
  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <!-- Gesture support -->
  <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  
  <!-- FBX Loader -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.125.2/examples/js/loaders/FBXLoader.js"></script>
</head>

<body style="margin:0; overflow:hidden; background:#000;">
  
  <a-scene embedded
           arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 15;"
           gesture-detector
           renderer="antialias: true; logarithmicDepthBuffer: true;">
    
    <!-- Marker Hiro -->
    <a-marker preset="hiro" id="marker" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;">
      
      <!-- Escanor FBX en AR -->
      <a-entity id="escanorAR" 
                class="clickable" 
                gesture-handler="rotationEnabled: true; scaleEnabled: true"
                position="0 0 -3" 
                scale="0.01 0.01 0.01">
      </a-entity>
      
    </a-marker>

    <!-- Escanor en VR (caché au départ) -->
    <a-entity id="escanorVR" 
              class="clickable" 
              gesture-handler="rotationEnabled: true; scaleEnabled: true"
              position="0 0 -3" 
              scale="0.01 0.01 0.01" 
              visible="false">
    </a-entity>

    <!-- Caméra -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#marker");
    const escanorVR = document.querySelector("#escanorVR");

    // Cache le bouton VR au départ
    const vrButton = document.querySelector(".a-enter-vr-button");
    if (vrButton) vrButton.style.display = "none";

    marker.addEventListener("markerFound", () => {
      // Affiche le bouton VR après détection du marker
      if (vrButton) vrButton.style.display = "block";
      escanorVR.setAttribute("visible", "true");
    });

    // Chargement du modèle Escanor FBX
    const fbxLoader = new THREE.FBXLoader();

    // Version AR
    fbxLoader.load("Escanor.fbx", function(object) {
      object.scale.set(0.01, 0.01, 0.01);
      object.position.set(0, 0, -3);
      document.querySelector("#escanorAR").object3D.add(object.clone());
    }, undefined, function(error){
      console.error("Erreur chargement FBX Escanor (AR):", error);
    });

    // Version VR
    fbxLoader.load("Escanor.fbx", function(object) {
      object.scale.set(0.01, 0.01, 0.01);
      object.position.set(0, 0, -3);
      escanorVR.object3D.add(object);
    }, undefined, function(error){
      console.error("Erreur chargement FBX Escanor (VR):", error);
    });
  </script>
</body>
</html>
