<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR déclenche VR - Escanor</title>
  
  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <!-- Loader FBX via Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.125.2/examples/js/loaders/FBXLoader.js"></script>
  
  <!-- Gesture support -->
  <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@components/gesture-detector/dist/gesture-detector.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@components/gesture-handler/dist/gesture-handler.min.js"></script>
</head>

<body style="margin:0; overflow:hidden; background:#111;">
  <a-scene embedded
           arjs="sourceType: webcam; trackingMethod: best; detectionMode: mono_and_matrix; debugUIEnabled: false;"
           renderer="antialias: true;">
    
    <!-- AR : modèle Escanor attaché au marqueur Hiro -->
    <a-marker preset="hiro">
      <a-entity id="escanorAR" gesture-handler="enabled: true"
                position="0 0 -3" scale="0.01 0.01 0.01"></a-entity>
    </a-marker>

    <!-- VR : modèle Escanor statique, visible après scan -->
    <a-entity id="escanorVR" gesture-handler="enabled: true"
              position="0 0 -3" scale="0.01 0.01 0.01" visible="false"></a-entity>

    <!-- Caméra avec détection des gestes -->
    <a-entity camera look-controls wasd-controls gesture-detector position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("a-marker");
    const escanorVR = document.querySelector("#escanorVR");

    // Cache le bouton VR au départ
    const vrButton = document.querySelector(".a-enter-vr-button");
    if (vrButton) vrButton.style.display = "none";

    marker.addEventListener("markerFound", () => {
      // Affiche le bouton VR après détection du marker
      if (vrButton) vrButton.style.display = "block";
      escanorVR.setAttribute("visible", "true");
    });

    // Chargement du modèle Escanor
    const fbxLoader = new THREE.FBXLoader();

    // Version AR
    fbxLoader.load("Escanor.fbx", function(object) {
      object.scale.set(0.01, 0.01, 0.01);
      object.position.set(0, 0, -3);
      document.querySelector("#escanorAR").object3D.add(object.clone());
    });

    // Version VR
    fbxLoader.load("Escanor.fbx", function(object) {
      object.scale.set(0.01, 0.01, 0.01);
      object.position.set(0, 0, -3);
      escanorVR.object3D.add(object);
    });
  </script>
</body>
</html>
