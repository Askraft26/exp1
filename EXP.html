<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene embedded arjs>
      <!-- Marqueur AR -->
      <a-marker preset="hiro">
        <!-- Vidéo affichée en AR -->
        <a-video id="myVideo"
                 src="br.mp4"
                 width="2" height="1.5"
                 autoplay="false" loop="true">
        </a-video>

        <!-- Bouton Play/Pause -->
        <a-box id="playButton"
               position="0 -1 0"
               depth="0.2" height="0.3" width="0.6"
               color="blue">
        </a-box>
        <a-text value="Play/Pause"
                position="0 -1 0.3"
                align="center"
                color="white">
        </a-text>
      </a-marker>

      <!-- Caméra -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Gestion du bouton Play/Pause
      document.addEventListener('DOMContentLoaded', () => {
        const videoEl = document.querySelector('#myVideo');
        const buttonEl = document.querySelector('#playButton');

        buttonEl.addEventListener('click', () => {
          const video = videoEl.components.material.material.map.image;
          if (video.paused) {
            video.play();
          } else {
            video.pause();
          }
        });
      });
    </script>
  </body>
</html>
