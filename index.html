<!DOCTYPE html>
<html>
  <head>
    <title>Démo AR avec GLB</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- AR.js pour A-Frame -->
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene embedded arjs>
      <!-- Marqueur AR (par défaut : "hiro") -->
      <a-marker preset="hiro">
        <!-- Charger ton modèle GLB -->
        <a-entity gltf-model="free_fire_new_gojo_3d_model.glb" scale="0.5 0.5 0.5"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
