<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/aframe/build/aframe-ar.js"></script>
    <title>AR Video - GitHub Pages</title>
  </head>
  <body style="margin:0; overflow:hidden;">

    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true;">

      <a-assets>
        <video id="brVideo" 
               src="br.mp4" 
               preload="auto" 
               response-type="arraybuffer"
               crossorigin="anonymous" 
               webkit-playsinline 
               playsinline 
               muted 
               loop="true">
        </video>
      </a-assets>

      <a-marker preset="hiro">
        
        <a-video id="videoScreen"
                 src="#brVideo"
                 width="2" height="1.1"
                 position="0 0.1 0"
                 rotation="-90 0 0"
                 class="clickable">
        </a-video>

        <a-box id="playButton"
               position="0 0.1 1.2"
               depth="0.1" height="0.3" width="0.8"
               color="#1565C0"
               class="clickable">
          <a-text id="btnLabel"
                  value="PLAY"
                  position="0 0 0.06"
                  align="center"
                  color="#FFFFFF"
                  width="2.5">
          </a-text>
        </a-box>

      </a-marker>

      <a-entity camera>
        <a-entity cursor="rayOrigin: mouse"
                  raycaster="objects: .clickable">
        </a-entity>
      </a-entity>

    </a-scene>

    <script>
      const video = document.querySelector('#brVideo');
      const button = document.querySelector('#playButton');
      const label = document.querySelector('#btnLabel');

      // Gestion du clic
      button.addEventListener('click', () => {
        if (video.paused) {
          // Sur certains navigateurs, il faut retirer le 'muted' après le premier clic
          video.muted = false; 
          video.play();
          label.setAttribute('value', 'PAUSE');
        } else {
          video.pause();
          label.setAttribute('value', 'PLAY');
        }
      });

      // Permettre de cliquer aussi sur la vidéo elle-même
      document.querySelector('#videoScreen').addEventListener('click', () => {
        if (video.paused) {
          video.muted = false;
          video.play();
          label.setAttribute('value', 'PAUSE');
        } else {
          video.pause();
          label.setAttribute('value', 'PLAY');
        }
      });
    </script>
  </body>
</html>
